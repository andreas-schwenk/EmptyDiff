# Style check of the Python source with pycodestyle (PEP 8), see dev/docker.sh lint.
# Lines: 79 characters, comments and docstrings 72 (PEP 8). The ignored codes are pycodestyle's defaults
# plus E203, which contradicts black for slices.
[pycodestyle]
max-line-length = 79
max-doc-length = 72
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E203
